site_name: MkDocs Example
# The Publisher passes the final public URL of this component as SITE_URL.
# Without it MkDocs writes root-relative links into 404.html that would point
# outside the component once it is mounted below the site's base path.
site_url: !ENV [SITE_URL, ""]
docs_dir: docs
# The hook adds the Documentation Publisher link markers to every page.
hooks:
  - hooks/publisher_markers.py
nav:
  - Home: index.md
  - Usage: usage.md
